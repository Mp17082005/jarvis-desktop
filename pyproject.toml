[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-home-assistant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "httpx>=0.27,<1", "python-dotenv>=1,<2", "python-multipart>=0.0.18", "pytest>=8,<10"]

[project.optional-dependencies]
voice = ["faster-whisper>=1.1,<2"]
desktop = ["openpyxl>=3.1,<4", "playwright>=1.50,<2", "sounddevice>=0.5,<1", "vosk>=0.3.45,<1"]
dev = ["pytest>=8,<10"]
app = ["keyring>=25", "pystray>=0.19", "pillow>=10", "faster-whisper>=1.1,<2", "sounddevice>=0.5,<1", "numpy>=1.26"]

[tool.setuptools]
packages = ["jarvis", "companion", "jarvis_desktop"]
py-modules = ["jarvis_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
